name: tests-and-evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m scripts.evaluate
      - run: python -m pytest -q
      - name: Evaluation is reproducible
        run: git diff --exit-code -- results/retrieval.json
